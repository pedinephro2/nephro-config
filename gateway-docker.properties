eureka.client.serviceUrl.defaultZone=http://eureka:8761/eureka
eureka.instance.hostname=gateway

spring.cloud.gateway.routes[0].id=transplant-mongo
spring.cloud.gateway.routes[0].uri=http://transplant-service:3001
spring.cloud.gateway.routes[0].predicates[0]=Path=/transplant-mongo/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=1

spring.cloud.gateway.routes[1].id=vital-signs
spring.cloud.gateway.routes[1].uri=http://vital-signs-service:8086
spring.cloud.gateway.routes[1].predicates[0]=Path=/vital-signs/**
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=1

spring.cloud.gateway.routes[2].id=report-scheduling
spring.cloud.gateway.routes[2].uri=http://microservice4:8084
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/schedules,/api/schedules/**
spring.cloud.gateway.routes[2].filters[0]=StripPrefix=0

spring.cloud.gateway.routes[3].id=hospitalisation
spring.cloud.gateway.routes[3].uri=http://hospitalisation:8089
spring.cloud.gateway.routes[3].predicates[0]=Path=/hospitalisation,/hospitalisation/**
spring.cloud.gateway.routes[3].filters[0]=StripPrefix=0
