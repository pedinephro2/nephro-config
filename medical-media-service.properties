spring.application.name=MEDICAL-MEDIA-SERVICE
server.port=8090

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/nephro_medical_media?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=false

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

huggingface.api.key=${HUGGINGFACE_KEY:CHANGE_MOI}
jwt.secret=${JWT_SECRET:MaCleJWTMedicaleMinimum256BitsAAAAAAAAAAAAAAAA}
jwt.expiration=${JWT_EXPIRATION:86400000}

cloudinary.cloud-name=${CLOUDINARY_CLOUD:dwehbywnm}

logging.level.com.esprit=INFO
logging.level.org.springframework.security=WARN

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
